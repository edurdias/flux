[flux]
log_level = "INFO"                                                 # Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s" # Log message format
log_date_format = "%Y-%m-%d %H:%M:%S"                               # Date format in log messages
server_host = "localhost"                                           # Host to bind the server to.
server_port = 8000                                                  # Port to bind the server to.
home = ".flux"                                                      # Home directory
cache_path = ".cache"                                               # Cache directory
local_storage_path = ".storage"                                     # Base path for storing task outputs
serializer = "pkl"                                                  # Default serializer (json or pkl)
database_url = "sqlite:///.flux/flux.db"                            # Database URL
# For PostgreSQL with environment variables:
# database_url = "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}"
# database_type = "postgresql"
# database_pool_size = 10
# database_max_overflow = 20

[flux.workers]
# bootstrap_token = "<set explicitly OR omit to let the server auto-generate>"
# When unset on the server, a fresh token is written to <home>/bootstrap-token
# on first start; retrieve it via 'flux server bootstrap-token'. Workers must
# always be supplied an explicit value (env var, flux.toml, or CLI flag).
server_url = "http://localhost:8000"                        # Default server URL to connect to
default_timeout = 30                                        # Default timeout for tasks in seconds
retry_attempts = 0                                          # Default number of retry attempts for failed tasks
retry_delay = 1                                             # Initial delay between retries in seconds
retry_backoff = 2                                           # Multiplier for subsequent retry delays
module_cache_ttl = 300                                      # Seconds to cache compiled workflow modules (0 to disable)
module_cache_max_size = 64                                  # LRU bound on cached workflow modules (0 = unbounded)
runners = ["inprocess", "subprocess"]                       # Runners enabled on this worker (advertised at registration)
default_runner = "subprocess"                               # Runner used when a workflow does not declare one
subprocess_term_grace = 10.0                                # Seconds between SIGTERM and SIGKILL when cancelling a child
subprocess_memory_limit = 0                                 # Address-space limit per child in bytes (Linux only, 0 = unlimited)
# To run executions in containers, add "docker" to runners and point
# docker_image at an image with flux-core installed (worker-compatible version):
# docker_image = "my-registry/flux-workflows:1.2.3"
# docker_network = ""                                       # Docker network ("" = docker default)
# docker_memory = ""                                        # Per-container memory limit, e.g. "512m"
# docker_cpus = 0.0                                         # Per-container CPU limit (0 = unlimited)
# docker_extra_args = []                                    # Extra 'docker run' args (volumes, env, --user, ...)
transient_fast_path = true                                  # call() on a transient workflow object runs in-process (mesh fast path)
loop_lag_threshold = 1.0                                    # Event-loop lag (s) counting as a health breach; 3 in a row = unhealthy (0 disables)
loop_lag_probe_interval = 1.0                               # Seconds between event-loop lag probes
# metrics_provider = "myapp.routing:collect_metrics"        # Callable returning dict[str, float]; advertised on heartbeats for routing metric(...) selectors
# metrics_interval = 10.0                                   # Seconds between metrics refreshes (provider + built-ins)
builtin_metrics = true                                      # Publish built-in flux.* metrics (loop lag, rates, durations, cpu/mem) on heartbeats
eviction_grace_period = 30                                  # Seconds to wait after marking worker stale before evicting
cancellation_orphan_grace = 300                             # Seconds before the scheduler resolves a CANCELLING execution whose worker never returned (0 = wait forever); parked cancels resolve immediately
join_token_retention = 86400                                # Seconds past expiry a join-token row is kept as audit trail before the hourly purge (0 = keep forever)

# Capability labels, equivalent to repeated --label flags (--label wins per
# key). A sub-table, so it must stay at the end of [flux.workers]: any key
# after the header would belong to it.
# [flux.workers.labels]
# node = "node-a"
# gpu = "true"

[flux.security.encryption]
# encryption_key = "<generate with: openssl rand -hex 32>"
# Required for the secrets store. Set via FLUX_SECURITY__ENCRYPTION__ENCRYPTION_KEY
# in production; a missing key surfaces a clear error on first encrypt/decrypt.

# Uncomment to enable API key authentication:
# [flux.security.auth.api_keys]
# enabled = true

# [flux.security.auth]
# default_user_roles = ["viewer"]
# resolution_cache_ttl = 30.0  # Per-process cache for token/permission resolution (0 disables);
#                              # revocations on other replicas take effect within this window.

# [flux.security]
# execution_token_ttl = 604800
# execution_token_secret = "<generate with openssl rand -hex 32>"

[flux.hooks]
# Outbound hooks: named subscriptions that start a workflow when an engine
# event matches a selector. Manage them with 'flux hook ...'.
enabled = true              # Master switch. false stops the outbox before it matches anything (hook rows stay, they just don't fire)
hop_limit = 3               # Links a chain of hook-started executions may have: hops 0, 1 and 2 fire, a delivery reaching this is dead-lettered
drain_batch_size = 20       # Due deliveries the scheduler tick settles per cycle (it shares the tick's dispatch lock)
snapshot_ttl_seconds = 5.0  # Max age of a replica's cached enabled-hook index; bounds how long it can keep matching a hook another replica changed (0 = no cache)

[flux.mcp]
name = "flux-workflows"                 # Name for the MCP server
host = "localhost"                      # Host to bind the MCP server to
port = 8080                             # Port for the MCP server
server_url = "http://localhost:8000"    # Default server URL to connect to
transport = "streamable-http"           # Transport protocol for MCP ("stdio", "streamable-http", "sse")

[flux.observability]
enabled = false                         # Enable OpenTelemetry observability (requires flux-core[observability])
service_name = "flux"                   # OTel service name
prometheus_enabled = true               # Expose Prometheus /metrics endpoint
# otlp_endpoint = "http://localhost:4317" # OTLP collector endpoint (uncomment to enable push export)
trace_sample_rate = 1.0                 # Trace sampling rate (0.0 to 1.0)
metric_export_interval = 60             # OTLP metric push interval in seconds
# Diagnostic (#263): run the server's event loop in asyncio debug mode and log
# every callback that holds it longer than this, in milliseconds. Debug mode
# costs throughput, so leave it unset except when hunting a blocking call --
# Python's own default threshold is 100ms, well above a single sync query.
# slow_callback_ms = 50

# OpenAI-compatible provider descriptors (#141B): each table registers one
# vendor speaking the chat-completions wire format, addressed as
# agent(model="<name>/<model>"). Several can coexist in one process — unlike
# the OPENAI_BASE_URL env var, which is process-global and single-valued.
# [flux.ai.providers.deepseek]
# base_url = "https://api.deepseek.com/v1"
# api_key_env = "DEEPSEEK_API_KEY"      # or api_key_secret = "deepseek-key" (Flux secret store)
# models = ["deepseek-chat", "deepseek-reasoner"]   # informational
